<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Agent Skills</title>
  <desc id="desc">Measure first. Improve with evidence. Three change budgets: Tune, Optimize, Rebuild.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172133"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6ee7b7" stop-opacity=".13"/><stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b2c6dd" stroke-opacity=".045"/></pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="338" rx="22" fill="url(#bg)" stroke="#2b384c"/>
  <rect x="1" y="1" width="1278" height="338" rx="22" fill="url(#grid)"/>
  <ellipse cx="1045" cy="75" rx="310" ry="260" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <circle cx="52" cy="38" r="5" fill="#fb7185"/><circle cx="70" cy="38" r="5" fill="#fbbf24"/><circle cx="88" cy="38" r="5" fill="#6ee7b7"/>
    <text x="112" y="43" font-size="12" letter-spacing="1.2" fill="#8ba0b9">PUNEET-CHANDNA / AGENT-SKILLS</text>
    <text x="52" y="124" font-size="56" font-weight="700" letter-spacing="-2" fill="#f4f7fb">Agent Skills<tspan fill="#6ee7b7">_</tspan></text>
    <text x="54" y="168" font-size="21" fill="#aabbd0">Measure first. Improve with evidence.</text>
    <g transform="translate(54 216)">
      <rect width="176" height="66" rx="12" fill="#11362f" stroke="#2c6c57"/>
      <text x="18" y="26" font-size="11" letter-spacing="1.5" fill="#8abda9">MODE 01</text>
      <text x="18" y="49" font-size="20" font-weight="600" fill="#9bf4ce">Tune</text>
      <rect x="192" width="212" height="66" rx="12" fill="#3c301e" stroke="#79603a"/>
      <text x="210" y="26" font-size="11" letter-spacing="1.5" fill="#c3ae88">MODE 02</text>
      <text x="210" y="49" font-size="20" font-weight="600" fill="#fcd493">Optimize</text>
      <rect x="420" width="196" height="66" rx="12" fill="#2d2648" stroke="#5d4b88"/>
      <text x="438" y="26" font-size="11" letter-spacing="1.5" fill="#b8a5dc">MODE 03</text>
      <text x="438" y="49" font-size="20" font-weight="600" fill="#d6bfff">Rebuild</text>
    </g>
    <g transform="translate(817 91)">
      <rect width="401" height="191" rx="14" fill="#0b1422" stroke="#334359"/>
      <text x="24" y="35" font-size="12" letter-spacing="1.3" fill="#758da8">THE WORKFLOW</text>
      <path d="M25 61H375" stroke="#25364b"/>
      <text x="25" y="92" font-size="17" fill="#6ee7b7">01<tspan dx="19" fill="#d8e3f0">Profile the bottleneck</tspan></text>
      <text x="25" y="128" font-size="17" fill="#fcd493">02<tspan dx="19" fill="#d8e3f0">Change one mechanism</tspan></text>
      <text x="25" y="164" font-size="17" fill="#c4a7ff">03<tspan dx="19" fill="#d8e3f0">Verify the result</tspan></text>
    </g>
  </g>
</svg>
