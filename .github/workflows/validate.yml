name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Evaluation packaging checks extract the pinned baseline skill.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package and k6 summary behavior
        run: python3 -m unittest discover -s tests -v
